name: Bug Report
description: Something isn't working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Elpis version
    validations:
      required: true

  - type: input
    id: gnome-version
    attributes:
      label: GNOME version
      placeholder: "e.g. 48"

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Run `flatpak run io.github.DavidMcFarlin.Elpis` from a terminal and paste any errors here.
      render: shell
