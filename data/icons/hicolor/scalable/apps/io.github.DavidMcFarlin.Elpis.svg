<?xml version="1.0" encoding="UTF-8"?>
<!-- Elpis app icon: the spark of hope above Pandora's jar (a pithos —
     this app's ancestor). Flat GNOME style, hand-drawn vector. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="42" x2="0" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8824a"/>
      <stop offset="1" stop-color="#c1531b"/>
    </linearGradient>
    <clipPath id="bodyclip">
      <path d="M 52,42 L 76,42 C 76,48 75,52 74,55 C 88,59 95,65 95,74 C 95,89 84,99 77,103 L 51,103 C 44,99 33,89 33,74 C 33,65 40,59 54,55 C 53,52 52,48 52,42 Z"/>
    </clipPath>
  </defs>

  <!-- handles (behind the body) -->
  <path d="M 46,42 C 31,48 31,63 42,68" fill="none" stroke="#9a4416" stroke-width="8" stroke-linecap="round"/>
  <path d="M 82,42 C 97,48 97,63 86,68" fill="none" stroke="#9a4416" stroke-width="8" stroke-linecap="round"/>

  <!-- vessel body -->
  <path d="M 52,42 L 76,42 C 76,48 75,52 74,55 C 88,59 95,65 95,74 C 95,89 84,99 77,103 L 51,103 C 44,99 33,89 33,74 C 33,65 40,59 54,55 C 53,52 52,48 52,42 Z" fill="url(#body)"/>

  <!-- painted bands -->
  <g clip-path="url(#bodyclip)">
    <rect x="26" y="67" width="76" height="5.5" fill="#f9e7d3" opacity="0.92"/>
    <rect x="26" y="77" width="76" height="2.5" fill="#f9e7d3" opacity="0.7"/>
    <rect x="26" y="96" width="76" height="7" fill="#9a4416" opacity="0.55"/>
  </g>

  <!-- rim -->
  <rect x="43" y="33" width="42" height="10" rx="4" fill="#b0500f"/>
  <rect x="43" y="33" width="42" height="6.5" rx="3.25" fill="#c95d1e"/>

  <!-- foot -->
  <path d="M 54,103 L 74,103 L 76,109 L 52,109 Z" fill="#a8481a"/>
  <rect x="46" y="109" width="36" height="8" rx="3.5" fill="#b0500f"/>

  <!-- the spark of hope, rising past the lip -->
  <path d="M 72,6 C 73.4,14 75.5,17.2 82,19 C 75.5,20.8 73.4,24 72,32 C 70.6,24 68.5,20.8 62,19 C 68.5,17.2 70.6,14 72,6 Z" fill="#f6d32d"/>
  <circle cx="87" cy="10" r="2.8" fill="#f6d32d" opacity="0.9"/>
  <circle cx="56" cy="24" r="2" fill="#f6d32d" opacity="0.7"/>
</svg>
